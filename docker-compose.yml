version: '3.8'

services:
  entegreshop-agency:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: entegreshop-agency
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - entegre_data:/app/data

volumes:
  entegre_data:
    driver: local
